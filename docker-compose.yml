services:
  # =========================================================================
  # DocuSpace PostgreSQL Database with Row-Level Security (RLS)
  # Internal network only — never exposed publicly
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: docuspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init/01_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docuspace-internal

  # =========================================================================
  # MinIO S3-Compatible Object Storage
  # Internal network only — never exposed publicly
  # =========================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docuspace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - docuspace-internal

  # =========================================================================
  # ClamAV Antivirus Daemon (Fail-closed document scanner)
  # Internal port 3310 only — egress allowed solely for freshclam CVD updates
  # =========================================================================
  clamav:
    image: clamav/clamav:latest
    container_name: docuspace-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "10"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - docuspace-internal
      - docuspace-edge

  # =========================================================================
  # Redis Cache & Rate-Limit Store
  # Internal network only — password required, never exposed publicly
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: docuspace-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - docuspace-internal

  # =========================================================================
  # DocuSpace Backend API (FastAPI, Python 3.11, SQLAlchemy 2 Async)
  # Non-root container, proxied exclusively through Nginx
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: docuspace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_FAIL_CLOSED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
    volumes:
      - quarantine_data:/tmp/docuspace/quarantine
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - docuspace-internal
      - docuspace-edge

  # =========================================================================
  # DocuSpace Frontend (React 19, TypeScript, Vite, Tailwind CSS)
  # Unprivileged Nginx static container, proxied exclusively through Nginx
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: docuspace-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - docuspace-edge

  # =========================================================================
  # Nginx Reverse Proxy (Only public entrypoint: ports 80 & 443)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: docuspace-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - docuspace-edge

networks:
  docuspace-internal:
    driver: bridge
    internal: true
  docuspace-edge:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  clamav_db:
  redis_data:
  quarantine_data:
  nginx_logs:
